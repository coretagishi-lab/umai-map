<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>うまい店マップ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23e5484d' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 地図（全画面） -->
  <div id="map" aria-label="地図"></div>

  <!-- 上部：検索バー＋絞り込み -->
  <header class="topbar" id="topbar">
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.7 10.7l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="q" type="search" placeholder="店名・住所・メモで検索" autocomplete="off" enterkeyhint="search" aria-label="検索">
      <button id="q-clear" class="search__clear" type="button" aria-label="検索語を消す" hidden>×</button>
      <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">
        絞り込み<span id="filter-badge" class="badge" hidden>0</span>
      </button>
    </div>
    <div id="active-filters" class="active-filters" hidden>
      <span id="active-summary"></span>
      <button id="filters-clear" type="button" class="link-btn">クリア</button>
    </div>
    <div id="filters" class="filters" hidden>
      <div class="filters__group"><div class="filters__label">エリア</div><div class="chips" data-filter="area"></div></div>
      <div class="filters__group"><div class="filters__label">種類</div><div class="chips" data-filter="kind"></div></div>
      <div class="filters__group"><div class="filters__label">出典</div><div class="chips" data-filter="source"></div></div>
      <div class="filters__group filters__group--row">
        <label class="switch"><input id="sento-toggle" type="checkbox"><span class="switch__ui" aria-hidden="true"></span>銭湯を表示</label>
        <span id="sento-count" class="muted"></span>
      </div>
    </div>
  </header>

  <!-- 右下：現在地・ズーム -->
  <div class="map-controls" id="map-controls">
    <button id="btn-locate" class="ctrl" type="button" aria-label="現在地">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    </button>
    <div class="zoom">
      <button id="btn-zoom-in" class="ctrl" type="button" aria-label="拡大">＋</button>
      <button id="btn-zoom-out" class="ctrl" type="button" aria-label="縮小">－</button>
    </div>
  </div>

  <!-- 下部：一覧ボトムシート -->
  <section id="sheet" class="sheet" data-state="peek" aria-label="一覧">
    <div class="sheet__handle" id="sheet-handle" role="button" tabindex="0" aria-label="一覧を開閉">
      <span class="sheet__grip" aria-hidden="true"></span>
      <div class="sheet__title"><span id="count">読み込み中…</span></div>
    </div>
    <ul id="list" class="list"></ul>
  </section>

  <!-- ピン選択時の詳細カード -->
  <article id="card" class="card" hidden aria-live="polite">
    <button id="card-close" class="card__close" type="button" aria-label="閉じる">×</button>
    <div id="card-body"></div>
  </article>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet/leaflet.markercluster.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
